.cc-stage{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  border:3px solid #0f172a;
  box-shadow:0 10px 25px rgba(15,23,42,.35);

    radial-gradient(circle at 80% 0%, rgba(56,189,248,.45), transparent 40%),

  margin-bottom:14px;
  color:#fff;
}
.cc-stage::before{
  content:'';
  position:absolute;
  top:0;left:12%;right:12%;height:4px;
  background:#7dd3fc;
  box-shadow:0 0 18px 4px #38bdf8;
  border-radius:0 0 8px 8px;
}
.cc-hud{
  display:grid;

  gap:8px;
  align-items:stretch;
  margin-bottom:10px;
  position:relative;
  z-index:2;
}
.cc-wing{
  background:linear-gradient(160deg,#1d4ed8,#0f296e);
  border:2px solid #38bdf8;
  border-radius:12px;
  padding:6px 8px;
  box-shadow:0 0 12px rgba(56,189,248,.35), inset 0 1px 0 rgba(255,255,255,.3);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}
.cc-wing.active{
  border-color:#fde047;
  box-shadow:0 0 16px rgba(253,224,71,.65);
}
.cc-trophy{
  width:28px;height:28px;
  border-radius:8px;

  border:1.5px solid #fff;

  font-size:.95rem;

  box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.cc-scorebox{
  background:#0a1c4d;
  border:1.5px solid #60a5fa;
  border-radius:8px;
  padding:2px 8px;
  text-align:center;
  min-width:52px;
}
.cc-scorebox small{display:block;font-size:.54rem;letter-spacing:.08em;color:#93c5fd;font-weight:800}
.cc-scorebox strong{font-family:'Dela Gothic One',sans-serif;font-size:.95rem;color:#fff}
.cc-pname{font-size:.66rem;font-weight:800;color:#e0f2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
.cc-exit{
  background:rgba(15,23,42,.7);
  border:1.5px solid #38bdf8;

  border-radius:10px;
  padding:0 10px;

}
.cc-frame{
  position:relative;

  border-radius:16px;
  box-shadow:0 0 22px rgba(56,189,248,.45);
  z-index:2;
}
.cc-screen{
  background:#f8fafc;
  border-radius:12px;
  overflow:hidden;
  border:2px solid #1e3a8a;
}
.cc-scr-head{
  background:linear-gradient(90deg,#1e3a8a,#1d4ed8,#1e3a8a);

  align-items:center;
  justify-content:space-between;

}

.cc-scr-body{padding:10px;color:#0f172a}

  border-radius:10px;

.cc-opt{

  font:inherit;font-weight:800;font-size:.78rem;
  color:#0f172a;
  background:linear-gradient(180deg,#ffffff,#e2e8f0);
  border:1.5px solid #94a3b8;
  border-radius:999px;
  padding:7px 10px;
  cursor:pointer;
  box-shadow:0 2px 0 #94a3b8;
  transition:transform .08s, background .15s;
}
.cc-opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.cc-opt:disabled{cursor:default}
.cc-opt b{color:#1e3a8a;font-weight:800}

.cc-opt.ok{background:linear-gradient(180deg,#bbf7d0,#4ade80);border-color:#16a34a;color:#052e16}
.cc-opt.no{background:linear-gradient(180deg,#fecdd3,#fb7185);border-color:#e11d48;color:#4c0519}
.cc-status{
  margin-top:8px;
  text-align:center;
  font-size:.75rem;
  font-weight:800;
  color:#1e3a8a;

  border:1px solid #bfdbfe;
  border-radius:8px;
  padding:5px 8px;
}

}

  margin:0 auto;
  padding-top:18px;
}
.cc-desk{
  height:44px;
  background:linear-gradient(180deg,#64748b 0%,#1e293b 45%,#0f172a 100%);
  border:2px solid #94a3b8;
  border-bottom:0;
  border-radius:14px 14px 0 0;
  box-shadow:0 -2px 14px rgba(56,189,248,.4), inset 0 2px 6px rgba(255,255,255,.35);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:6px;
}
.cc-desk span{font-size:.62rem;font-weight:800;letter-spacing:.1em;color:#93c5fd;text-transform:uppercase}
.cc-buzzer-wrap{
  position:absolute;

}
.cc-buzzer{
  position:relative;
  width:84px;height:44px;
  background:none;border:0;padding:0;
  cursor:pointer;
}
.cc-buzzer-base{
  position:absolute;
  bottom:0;left:4px;right:4px;height:16px;
  background:linear-gradient(180deg,#334155,#0f172a);
  border:2px solid #94a3b8;
  border-radius:10px;
  box-shadow:0 4px 8px rgba(0,0,0,.6);
}
.cc-buzzer-dome{
  position:absolute;
  bottom:10px;left:12px;right:12px;height:30px;
  border-radius:50% 50% 18% 18% / 75% 75% 25% 25%;
  background:radial-gradient(circle at 35% 28%, #fca5a5 0%, #ef4444 35%, #b91c1c 80%, #7f1d1d 100%);
  border:2px solid #450a0a;
  box-shadow:0 4px 0 #7f1d1d, 0 0 18px rgba(239,68,68,.85);
  transition:transform .08s, box-shadow .08s;
}
.cc-buzzer:not(:disabled) .cc-buzzer-dome{animation:ccPulse 1.1s infinite}
.cc-buzzer:active:not(:disabled) .cc-buzzer-dome{transform:translateY(4px);box-shadow:0 0 0 #7f1d1d}
.cc-buzzer:disabled .cc-buzzer-dome{filter:grayscale(.65) brightness(.75);animation:none;box-shadow:0 2px 0 #334155}
@keyframes ccPulse{
  0%,100%{box-shadow:0 4px 0 #7f1d1d, 0 0 14px rgba(239,68,68,.65)}
  50%{box-shadow:0 4px 0 #7f1d1d, 0 0 28px rgba(248,113,113,1)}
}

#sakura-bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;transition:opacity .3s ease}

.btn,.opt,.cc-opt,.cc-buzzer,.nav button{transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s ease,background-color .15s ease;will-change:transform}

/* ---------- EFEK GUGURAN BUNGA SAKURA (60FPS HARDWARE ACCELERATED) ---------- */
const SAKURA_CV = document.getElementById('sakura-bg');
const SAKURA_CTX = SAKURA_CV.getContext('2d');
const PETALS = Array.from({length: 28}, () => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  s: 5 + Math.random() * 6,
  vy: 0.55 + Math.random() * 0.9,
  vx: -0.4 + Math.random() * 0.8,
  rot: Math.random() * Math.PI * 2,
  vrot: (Math.random() - 0.5) * 0.04,
  sway: Math.random() * Math.PI * 2,
  col: ['#ffc2d9', '#ff9ec4', '#ffe0ec', '#ffb3d1'][Math.floor(Math.random() * 4)]
}));
function resizeSakura(){
  SAKURA_CV.width = innerWidth;
  SAKURA_CV.height = innerHeight;
}
window.addEventListener('resize', resizeSakura, {passive: true});
resizeSakura();

let sakuraRaf = 0;
function loopSakura(){
  const onRpgMap = S.user && S.tab === 'belajar' && !S.les;
  SAKURA_CV.style.opacity = onRpgMap ? '0' : '1';
  if(!onRpgMap && !document.hidden){
    const W = SAKURA_CV.width, H = SAKURA_CV.height;
    SAKURA_CTX.clearRect(0, 0, W, H);
    for(let i = 0; i < PETALS.length; i++){
      const p = PETALS[i];
      p.sway += 0.025;
      p.x += p.vx + Math.sin(p.sway) * 0.45;
      p.y += p.vy;
      p.rot += p.vrot;
      if(p.y > H + 15){ p.y = -15; p.x = Math.random() * W; }
      if(p.x > W + 15) p.x = -15;
      if(p.x < -15) p.x = W + 15;
      SAKURA_CTX.save();
      SAKURA_CTX.translate(p.x, p.y);
      SAKURA_CTX.rotate(p.rot);
      SAKURA_CTX.fillStyle = p.col;
      SAKURA_CTX.beginPath();
      SAKURA_CTX.moveTo(0, -p.s);
      SAKURA_CTX.bezierCurveTo(p.s, -p.s, p.s, p.s * 0.6, 0, p.s);
      SAKURA_CTX.bezierCurveTo(-p.s, p.s * 0.6, -p.s, -p.s, 0, -p.s);
      SAKURA_CTX.fill();
      SAKURA_CTX.restore();
    }
  }
  sakuraRaf = requestAnimationFrame(loopSakura);
}
loopSakura();

function startRealtimeListeners(){
  if(!db || !auth?.currentUser || !S.user) return;
  if(unsubPlayers) unsubPlayers();
  if(unsubInvites) unsubInvites();
  if(hbTimer) clearInterval(hbTimer);

  // Heartbeat setiap 15 detik agar status online real-time akurat
  hbTimer = setInterval(()=>{
    if(db && auth?.currentUser && S.user){
      updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'players', S.user.uid), { lastSeen: Date.now(), online: true }).catch(()=>{});
    }
  }, 15000);

  // Dengarkan semua pemain real yang login
  unsubPlayers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'players'), (snap)=>{
    const seenIds = new Set();
    snap.forEach(d=>{
      const data = d.data();
      seenIds.add(d.id);
      ONLINE_USERS[d.id] = data;
    });
    Object.keys(ONLINE_USERS).forEach(k=>{ if(!seenIds.has(k)) delete ONLINE_USERS[k]; });
    if(!S.du && (S.tab==='duel' || S.tab==='profil' || S.viewProf)) render();
  }, (err)=>console.error(err));

  // Dengarkan tantangan duel masuk (real-time invite)
  unsubInvites = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'duel_invites'), (snap)=>{
    snap.forEach(d=>{
      const inv = { id: d.id, ...d.data() };
      if(inv.toUid === S.user.uid && inv.status === 'pending' && Date.now() - (inv.createdAt||0) < 45000){
        if(!S.du && !$('#modal').innerHTML.includes('TANTANGAN DUEL MASUK')){
          showIncomingDuelModal(inv);
        }
      }
      if(inv.fromUid === S.user.uid && inv.status === 'accepted' && inv.roomId && (!S.du || S.du.roomId !== inv.roomId)){
        $('#modal').innerHTML = '';
        joinLiveRoom(inv.roomId, inv.toName);
      }
      if(inv.fromUid === S.user.uid && inv.status === 'declined'){
        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'duel_invites', inv.id)).catch(()=>{});
        if($('#modal').innerHTML.includes('Menunggu')){
          $('#modal').innerHTML = `<div class='ov' onclick='cm()'><section class='pn' style='text-align:center'><div class='tag'>DITOLAK</div><p style='margin:8px 0'><b>${inv.toName}</b> sedang sibuk atau menolak tantangan.</p><button class='btn w' onclick='cm()'>Tutup</button></section></div>`;
        }
      }
    });
  }, (err)=>console.error(err));
}

    <div class='tag'>TANTANGAN DUEL MASUK!</div>
    <h2 class='ttl' style='font-size:1.15rem;margin:8px 0'>${inv.fromName}</h2>
    <p style='font-weight:700'>Mengajakmu bertanding Cerdas Cermat 1v1 secara langsung!</p>
    <div class='g2' style='margin-top:12px'>

function joinLiveRoom(roomId, oppName){
  if(S.du) exitDuel();
  S.tab = 'duel';
  S.du = {
    live: true,
    roomId,
    on: oppName,
    qs: [],
    i: 0,
    us: 0,
    os: 0,
    t: 10,
    ph: 'buzz',
    msg: 'Menghubungkan panggung studio...',
    ch: null,
    el: null,
    done: false,
    recorded: false
  };
  S.du.iv = setInterval(tickLiveDuel, 500);
  unsubRoom = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'duel_rooms', roomId), (snap)=>{
    if(!snap.exists() || !S.du || S.du.roomId !== roomId) return;
    const r = snap.data();
    const isP1 = r.p1.uid === S.user.uid;
    const meObj = isP1 ? r.p1 : r.p2;
    const opObj = isP1 ? r.p2 : r.p1;
    S.du.on = opObj.name;
    S.du.us = meObj.score;
    S.du.os = opObj.score;
    S.du.qs = r.qs.map(x=>[x.cat, x.q, x.opts, x.ans, x.exp]);
    S.du.i = r.i;
    S.du.roundEndsAt = r.roundEndsAt || (Date.now()+10000);
    S.du.t = Math.max(0, Math.ceil((S.du.roundEndsAt - Date.now())/1000));
    S.du.el = r.el;
    S.du.ch = r.ch;
    S.du.msg = r.msg;
    S.du.done = r.done;

    if(r.ph === 'buzz') S.du.ph = 'buzz';
    else if(r.ph === 'ans') S.du.ph = (r.holder === S.user.uid) ? 'me' : 'opp';
    else if(r.ph === 'rebound') S.du.ph = (r.holder === S.user.uid) ? 'rbme' : 'rbop';
    else if(r.ph === 'rev') S.du.ph = 'rev';

    if(r.done && !S.du.recorded){
      S.du.recorded = true;
      clearInterval(S.du.iv);
      S.du.o = S.du.us > S.du.os ? 'Menang' : (S.du.us === S.du.os ? 'Seri' : 'Kalah');
      S.w.duel.unshift({ o: S.du.o, on: S.du.on + ' (Real)', us: S.du.us, os: S.du.os });
      act('Duel Real vs ' + S.du.on, S.du.o + ' (' + S.du.us + '-' + S.du.os + ')');
      ign();
      cele(S.du.o === 'Menang' ? 'Kemenangan Duel Real!' : 'Duel Real Selesai!', 'Skor akhir ' + S.du.us + ' - ' + S.du.os + ' melawan ' + S.du.on + '.');
    }
    render();
  }, (err)=>console.error(err));
  render();
}

async function tickLiveDuel(){
  const m = S.du;
  if(!m || !m.live || m.done || !db || !auth?.currentUser) return;
  const rem = Math.max(0, Math.ceil(((m.roundEndsAt||Date.now()) - Date.now())/1000));
  m.t = rem;
  const el = document.getElementById('dtm');
  if(el) el.textContent = fmtSec(rem);

  if(rem === 0 && !m.tLock){
    m.tLock = true;
    setTimeout(()=>{ if(S.du) S.du.tLock = false; }, 1500);
    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'duel_rooms', m.roomId);
    const snap = await getDoc(roomRef);
    if(!snap.exists()) return;
    const r = snap.data();
    if(r.done) return;
    const q = r.qs[r.i];
    if(r.ph === 'buzz' && r.p1.uid === S.user.uid){
      await updateDoc(roomRef, { ph: 'rev', msg: 'Waktu habis! Kunci: ' + 'ABCD'[q.ans] + '.', roundEndsAt: Date.now()+2000 });
      setTimeout(()=>advanceLiveRound(m.roomId), 2000);
    }else if(r.ph === 'ans' && r.holder === S.user.uid){
      const isP1 = r.p1.uid === S.user.uid;
      const oppUid = isP1 ? r.p2.uid : r.p1.uid;
      const oppName = isP1 ? r.p2.name : r.p1.name;
      const upd = { ph: 'rebound', holder: oppUid, msg: S.user.name + ' kehabisan waktu (−50)! Lemparan ke ' + oppName + '.', roundEndsAt: Date.now()+8000 };
      if(isP1) upd['p1.score'] = r.p1.score - 50; else upd['p2.score'] = r.p2.score - 50;
      await updateDoc(roomRef, upd);
    }else if(r.ph === 'rebound' && r.holder === S.user.uid){
      await updateDoc(roomRef, { ph: 'rev', msg: 'Lemparan habis waktu. Kunci: ' + 'ABCD'[q.ans] + '.', roundEndsAt: Date.now()+2000 });
      setTimeout(()=>advanceLiveRound(m.roomId), 2000);
    }
  }
}

async function advanceLiveRound(roomId){
  if(!db || !auth?.currentUser) return;
  const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'duel_rooms', roomId);
  const snap = await getDoc(roomRef);
  if(!snap.exists()) return;
  const r = snap.data();
  if(r.done) return;
  if(r.i + 1 < r.qs.length){
    await updateDoc(roomRef, {
      i: r.i + 1,
      ph: 'buzz',
      holder: null,
      el: null,
      ch: null,
      msg: 'Babak berikutnya! Tekan BEL merah!',
      roundEndsAt: Date.now() + 12000
    });
  }else{
    await updateDoc(roomRef, { done: true, ph: 'rev', msg: 'Pertandingan selesai!' });
  }
}

async function buzz(){
  const m=S.du;if(!m||m.ph!=='buzz')return;

}
async function ans(i){
  const m=S.du;if(!m)return;const q=m.qs[m.i];
  if(m.live){
    if(!db || !auth?.currentUser) return;
    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'duel_rooms', m.roomId);
    const snap = await getDoc(roomRef);
    if(!snap.exists()) return;
    const r = snap.data();
    if(r.holder !== S.user.uid) return;
    const isP1 = r.p1.uid === S.user.uid;
    const oppUid = isP1 ? r.p2.uid : r.p1.uid;
    const oppName = isP1 ? r.p2.name : r.p1.name;
    if(r.ph === 'ans'){
      if(i === q[3]){
        const upd = { ph: 'rev', ch: i, msg: S.user.name + ' benar (+100)! Kunci: ' + 'ABCD'[q[3]] + '.', roundEndsAt: Date.now()+2000 };
        if(isP1) upd['p1.score'] = r.p1.score + 100; else upd['p2.score'] = r.p2.score + 100;
        await updateDoc(roomRef, upd);
        setTimeout(()=>advanceLiveRound(m.roomId), 2000);
      }else{
        const upd = { ph: 'rebound', holder: oppUid, el: i, msg: S.user.name + ' salah (−50)! Lemparan ke ' + oppName + '...', roundEndsAt: Date.now()+8000 };
        if(isP1) upd['p1.score'] = r.p1.score - 50; else upd['p2.score'] = r.p2.score - 50;
        await updateDoc(roomRef, upd);
      }
    }else if(r.ph === 'rebound'){
      if(i === q[3]){
        const upd = { ph: 'rev', ch: i, msg: S.user.name + ' tepat menjawab lemparan (+100)! Kunci: ' + 'ABCD'[q[3]] + '.', roundEndsAt: Date.now()+2000 };
        if(isP1) upd['p1.score'] = r.p1.score + 100; else upd['p2.score'] = r.p2.score + 100;
        await updateDoc(roomRef, upd);
      }else{
        await updateDoc(roomRef, { ph: 'rev', ch: i, msg: 'Lemparan kurang tepat. Kunci: ' + 'ABCD'[q[3]] + '.', roundEndsAt: Date.now()+2000 });
      }
      setTimeout(()=>advanceLiveRound(m.roomId), 2000);
    }
    return;
  }
  clearTimeout(m.tm);if(m.ph==='me'){if(i===q[3]){m.us+=100;reveal('Tepat! +100.',q[3],i)}else{m.us-=50;m.el=i;m.ph='rbop';m.msg='Salah (−50). Lemparan ke lawan…';render();m.tm=setTimeout(()=>{if(Math.random()<.5){m.os+=100;reveal(m.on+' benar, +100.',q[3],i)}else reveal('Lawan juga salah.',q[3],i)},1600)}}else if(m.ph==='rbme'){if(i===q[3]){m.us+=100;reveal('Lemparan benar! +100.',q[3],i)}else reveal('Kurang tepat, skormu aman.',q[3],i)}
}
async function pass(){
