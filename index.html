<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rascademy — Petualangan Hutan</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1340;--card:#fffafd;--soft:#ffeaf5;--pk:#ff4f9a;--yl:#ffc83d;--cy:#1fb5e6;--txt:#1b1340;--mut:#66598c;--sh:#1b1340;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;font-weight:500;color:var(--txt);background:linear-gradient(170deg,#ffe3f1,#d4ecff) fixed;min-height:100dvh;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:0 14px 104px;min-height:100dvh}
.ttl,.btn,.kj{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:8px}
.row{display:flex;align-items:center;gap:10px}.bt{justify-content:space-between}
.pn{background:var(--card);border:2.5px solid var(--ink);border-radius:6px 20px 6px 20px;box-shadow:5px 5px 0 var(--sh);padding:14px;margin-bottom:16px}
.hero{background:linear-gradient(120deg,var(--pk),#ff9a5c 60%,var(--yl))}
.tag{display:inline-block;background:var(--yl);border:2px solid var(--ink);padding:1px 10px;font-weight:800;font-size:.72rem;transform:skew(-10deg);margin-bottom:6px}
.btn{font-size:.85rem;background:var(--pk);color:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 16px;box-shadow:3px 3px 0 var(--sh);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:none}.btn.yl{background:var(--yl);color:#1b1340}.btn.gh{background:var(--card);color:var(--txt)}.btn.w{width:100%}.btn.sm{padding:6px 12px;font-size:.74rem}.btn:disabled{opacity:.45}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mut{color:var(--mut);font-size:.8rem}
.kj{width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:1.2rem;background:var(--yl);border:2.5px solid var(--ink);border-radius:50% 12px 50% 12px;box-shadow:3px 3px 0 var(--sh)}
.st{text-align:center;padding:8px 4px;border:2px solid var(--ink);border-radius:8px;background:var(--soft)}.st strong{display:block;font-size:1rem}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--txt);background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer;box-shadow:3px 3px 0 var(--sh)}
.opt b{flex:none;width:26px;height:26px;display:grid;place-items:center;background:var(--yl);border:2px solid var(--ink);border-radius:50%;font-size:.78rem}
.opt.on{background:var(--cy)}.opt.ok{background:#8ef0bf}.opt.no{background:#ffa3b5}
.fm{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:#10133a;color:#7fe3ff;border:2.5px solid var(--ink);border-radius:8px;padding:12px;text-align:center;margin:10px 0;overflow-x:auto}
.it{padding:10px;border:2px dashed var(--ink);border-radius:8px;margin-top:8px;background:var(--soft)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tabs button{font:inherit;font-weight:800;font-size:.72rem;padding:7px 2px;border:2px solid var(--ink);border-radius:8px;background:var(--card)}.tabs .on{background:var(--pk);color:#fff}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden}.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pk) 0 8px,#ff7db8 8px 16px)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:3px solid var(--ink);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.nav button{font:inherit;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;color:#3f3566;font-size:.62rem;white-space:nowrap}
.nav .k{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','Segoe UI',sans-serif;font-weight:400;font-size:1.3rem;width:40px;height:30px;display:grid;place-items:center;border-radius:8px}
.nav .on{color:#1b1340;font-weight:700}.nav .on .k{background:var(--pk);color:#fff;border:2px solid var(--ink)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,6,36,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.ov .pn{width:100%;max-width:400px;margin:0}
#mapwrap{position:fixed;inset:0;z-index:5;background:#1a2a1e;overflow:hidden}
#mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.plate{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;background:#fff8e8;border:3px solid #2a2a4a;border-radius:10px;padding:4px 12px;font-family:'Dela Gothic One',sans-serif;font-size:.78rem;color:#2a2a4a;box-shadow:3px 3px 0 #2a2a4a}
.win{position:absolute;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top,0px));bottom:auto;background:linear-gradient(#fffdf6,#fbeccb);border:3px solid #2a2a4a;border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 #2a2a4a;color:#2a2a4a;font-weight:700;font-size:.86rem;min-height:72px;cursor:pointer}
.win b{font-family:'Dela Gothic One',sans-serif;font-weight:400;color:#c2185b}
.scroll{background:#f4e1b4;border:3px dashed #3b2a14;color:#3b2a14;transform:rotate(-1deg)}
.joy{position:absolute;left:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,240,.35),rgba(255,250,240,.12) 65%);border:3px solid rgba(255,250,240,.9);box-shadow:0 0 0 3px rgba(42,42,74,.6);touch-action:none;user-select:none;-webkit-user-select:none}
.joy::before{content:'';position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(255,250,240,.5)}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffc8dd 45%,#ff4f9a);border:3px solid #2a2a4a;box-shadow:0 4px 0 #2a2a4a;pointer-events:none}
.abtn{position:absolute;right:22px;bottom:calc(110px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;font-family:'Dela Gothic One',sans-serif;font-size:1.6rem;background:#8a8aa8;color:#fff;border:3px solid #2a2a4a;box-shadow:0 5px 0 #2a2a4a;opacity:.75;touch-action:none}
.abtn:active{transform:translateY(4px);box-shadow:0 1px 0 #2a2a4a}
.abtn.on{background:var(--pk);opacity:1;animation:pls 1s infinite}
@keyframes pls{50%{filter:brightness(1.2)}}

/* ---------- STUDIO CERDAS CERMAT FUTURISTIK ---------- */
.cc-stage{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  border:3px solid #0f172a;
  box-shadow:0 10px 25px rgba(15,23,42,.35);
  background:
    radial-gradient(circle at 20% 0%, rgba(56,189,248,.45), transparent 40%),
    radial-gradient(circle at 80% 0%, rgba(56,189,248,.45), transparent 40%),
    linear-gradient(180deg, #061433 0%, #0b2966 48%, #071942 75%, #040d24 100%);
  padding:12px 10px 0;
  margin-bottom:14px;
  color:#fff;
}
.cc-stage::before{
  content:'';
  position:absolute;
  top:0;left:12%;right:12%;height:4px;
  background:#7dd3fc;
  box-shadow:0 0 18px 4px #38bdf8;
  border-radius:0 0 8px 8px;
}
.cc-hud{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:8px;
  align-items:stretch;
  margin-bottom:10px;
  position:relative;
  z-index:2;
}
.cc-wing{
  background:linear-gradient(160deg,#1d4ed8,#0f296e);
  border:2px solid #38bdf8;
  border-radius:12px;
  padding:6px 8px;
  box-shadow:0 0 12px rgba(56,189,248,.35), inset 0 1px 0 rgba(255,255,255,.3);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}
.cc-wing.active{
  border-color:#fde047;
  box-shadow:0 0 16px rgba(253,224,71,.65);
}
.cc-trophy{
  width:28px;height:28px;
  border-radius:8px;
  background:radial-gradient(circle at 30% 30%,#fef08a,#eab308);
  border:1.5px solid #fff;
  display:grid;place-items:center;
  font-size:.95rem;
  flex:none;
  box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.cc-scorebox{
  background:#0a1c4d;
  border:1.5px solid #60a5fa;
  border-radius:8px;
  padding:2px 8px;
  text-align:center;
  min-width:52px;
}
.cc-scorebox small{display:block;font-size:.54rem;letter-spacing:.08em;color:#93c5fd;font-weight:800}
.cc-scorebox strong{font-family:'Dela Gothic One',sans-serif;font-size:.95rem;color:#fff}
.cc-pname{font-size:.66rem;font-weight:800;color:#e0f2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
.cc-exit{
  background:rgba(15,23,42,.7);
  border:1.5px solid #38bdf8;
  color:#e0f2fe;
  border-radius:10px;
  padding:0 10px;
  font-weight:800;
  cursor:pointer;
}
.cc-frame{
  position:relative;
  background:linear-gradient(180deg,#cbd5e1,#64748b);
  padding:5px;
  border-radius:16px;
  box-shadow:0 0 22px rgba(56,189,248,.45);
  z-index:2;
}
.cc-screen{
  background:#f8fafc;
  border-radius:12px;
  overflow:hidden;
  border:2px solid #1e3a8a;
}
.cc-scr-head{
  background:linear-gradient(90deg,#1e3a8a,#1d4ed8,#1e3a8a);
  color:#fff;
  padding:8px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:2px solid #93c5fd;
}
.cc-scr-title{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.86rem}
.cc-scr-timer{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:.88rem;background:rgba(15,23,42,.35);padding:2px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.35)}
.cc-scr-body{padding:10px;color:#0f172a}
.cc-round-pill{display:inline-block;font-size:.66rem;font-weight:800;color:#1d4ed8;background:#dbeafe;padding:2px 8px;border-radius:99px;margin-bottom:6px}
.cc-qbox{
  background:#ffffff;
  border:1.5px solid #cbd5e1;
  border-radius:10px;
  padding:12px 10px;
  text-align:center;
  font-weight:800;
  font-size:.92rem;
  color:#0f172a;
  box-shadow:inset 0 2px 4px rgba(15,23,42,.04);
  margin-bottom:10px;
}
.cc-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cc-opt{
  display:flex;align-items:center;gap:6px;
  width:100%;text-align:left;
  font:inherit;font-weight:800;font-size:.78rem;
  color:#0f172a;
  background:linear-gradient(180deg,#ffffff,#e2e8f0);
  border:1.5px solid #94a3b8;
  border-radius:999px;
  padding:7px 10px;
  cursor:pointer;
  box-shadow:0 2px 0 #94a3b8;
  transition:transform .08s, background .15s;
}
.cc-opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.cc-opt:disabled{cursor:default}
.cc-opt b{color:#1e3a8a;font-weight:800}
.cc-opt.on{background:linear-gradient(180deg,#bae6fd,#38bdf8);border-color:#0284c7;color:#0c4a6e}
.cc-opt.ok{background:linear-gradient(180deg,#bbf7d0,#4ade80);border-color:#16a34a;color:#052e16}
.cc-opt.no{background:linear-gradient(180deg,#fecdd3,#fb7185);border-color:#e11d48;color:#4c0519}
.cc-status{
  margin-top:8px;
  text-align:center;
  font-size:.75rem;
  font-weight:800;
  color:#1e3a8a;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:8px;
  padding:5px 8px;
}
.cc-floor{
  position:relative;
  margin-top:10px;
  padding-top:18px;
  background:
    repeating-linear-gradient(90deg, rgba(56,189,248,.12) 0 1px, transparent 1px 36px),
    linear-gradient(180deg, rgba(14,116,144,.25), rgba(30,58,138,.65));
  border-top:2px solid #38bdf8;
  box-shadow:0 -4px 16px rgba(56,189,248,.45);
}
.cc-podium{
  position:relative;
  width:76%;
  max-width:270px;
  margin:0 auto;
  padding-top:18px;
}
.cc-desk{
  height:44px;
  background:linear-gradient(180deg,#64748b 0%,#1e293b 45%,#0f172a 100%);
  border:2px solid #94a3b8;
  border-bottom:0;
  border-radius:14px 14px 0 0;
  box-shadow:0 -2px 14px rgba(56,189,248,.4), inset 0 2px 6px rgba(255,255,255,.35);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:6px;
}
.cc-desk span{font-size:.62rem;font-weight:800;letter-spacing:.1em;color:#93c5fd;text-transform:uppercase}
.cc-buzzer-wrap{
  position:absolute;
  top:-6px;left:50%;
  transform:translateX(-50%);
  z-index:4;
}
.cc-buzzer{
  position:relative;
  width:84px;height:44px;
  background:none;border:0;padding:0;
  cursor:pointer;
}
.cc-buzzer-base{
  position:absolute;
  bottom:0;left:4px;right:4px;height:16px;
  background:linear-gradient(180deg,#334155,#0f172a);
  border:2px solid #94a3b8;
  border-radius:10px;
  box-shadow:0 4px 8px rgba(0,0,0,.6);
}
.cc-buzzer-dome{
  position:absolute;
  bottom:10px;left:12px;right:12px;height:30px;
  border-radius:50% 50% 18% 18% / 75% 75% 25% 25%;
  background:radial-gradient(circle at 35% 28%, #fca5a5 0%, #ef4444 35%, #b91c1c 80%, #7f1d1d 100%);
  border:2px solid #450a0a;
  box-shadow:0 4px 0 #7f1d1d, 0 0 18px rgba(239,68,68,.85);
  transition:transform .08s, box-shadow .08s;
}
.cc-buzzer:not(:disabled) .cc-buzzer-dome{animation:ccPulse 1.1s infinite}
.cc-buzzer:active:not(:disabled) .cc-buzzer-dome{transform:translateY(4px);box-shadow:0 0 0 #7f1d1d}
.cc-buzzer:disabled .cc-buzzer-dome{filter:grayscale(.65) brightness(.75);animation:none;box-shadow:0 2px 0 #334155}
@keyframes ccPulse{
  0%,100%{box-shadow:0 4px 0 #7f1d1d, 0 0 14px rgba(239,68,68,.65)}
  50%{box-shadow:0 4px 0 #7f1d1d, 0 0 28px rgba(248,113,113,1)}
}
.inp{width:100%;font:inherit;font-weight:700;color:var(--txt);background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;margin-top:6px;outline:none}
.inp:focus{border-color:var(--pk);box-shadow:0 0 0 3px rgba(255,79,154,.2)}
.dot-on{display:inline-block;width:9px;height:9px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;margin-right:5px}
.dot-off{display:inline-block;width:9px;height:9px;border-radius:50%;background:#94a3b8;margin-right:5px}
#sakura-bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;transition:opacity .3s ease}
#app{position:relative;z-index:2}
.btn,.opt,.cc-opt,.cc-buzzer,.nav button{transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s ease,background-color .15s ease;will-change:transform}
</style></head><body>
<canvas id="sakura-bg"></canvas>
<div id="app"><header class="top" id="top"></header><main id="main"></main></div>
<nav class="nav" id="nav"></nav>
<div id="modal"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const $=s=>document.querySelector(s);
const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
let db = null, auth = null, fbUid = null, unsubPlayers = null, unsubInvites = null, unsubRoom = null, hbTimer = null;
const ONLINE_USERS = {};
const BC = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('rascademy_live_' + appId) : null;
const LS_PLAYERS_KEY = 'rascademy_shared_players_' + appId;
const LS_SIGNAL_KEY = 'rascademy_shared_signal_' + appId;
const SS_USER_KEY = 'rascademy_tab_user_' + appId;

function nameToKey(name){
  const clean = (name || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
  return 'player_' + (clean || 'guest');
}

function readSharedDirectory(){
  try{
    const raw = window.localStorage ? localStorage.getItem(LS_PLAYERS_KEY) : null;
    if(!raw) return;
    const map = JSON.parse(raw);
    if(map && typeof map === 'object'){
      Object.keys(map).forEach(k=>{
        if(map[k] && map[k].uid) ONLINE_USERS[map[k].uid] = map[k];
      });
    }
  }catch(e){}
}

function writeSharedPlayer(prof){
  if(!prof || !prof.uid) return;
  ONLINE_USERS[prof.uid] = prof;
  try{
    if(window.localStorage){
      const raw = localStorage.getItem(LS_PLAYERS_KEY);
      const map = raw ? JSON.parse(raw) : {};
      map[prof.uid] = prof;
      localStorage.setItem(LS_PLAYERS_KEY, JSON.stringify(map));
    }
  }catch(e){}
}

function sendCrossTabSignal(payload){
  const msg = { ...payload, _ts: Date.now(), _rnd: Math.random() };
  if(BC) try{ BC.postMessage(msg); }catch(e){}
  try{
    if(window.localStorage) localStorage.setItem(LS_SIGNAL_KEY, JSON.stringify(msg));
  }catch(e){}
}

function handleRealtimeSignal(msg){
  if(!msg) return;
  if(msg.type === 'PLAYER_SYNC' && msg.profile){
    ONLINE_USERS[msg.profile.uid] = msg.profile;
    if(S.user && !S.du && (S.tab==='duel' || S.tab==='profil')) render();
  }else if(msg.type === 'PLAYER_OFFLINE' && msg.uid){
    if(ONLINE_USERS[msg.uid]) ONLINE_USERS[msg.uid].online = false;
    if(S.user && !S.du && (S.tab==='duel' || S.tab==='profil')) render();
  }else if(msg.type === 'REQUEST_PRESENCE' && S.user && S.w){
    broadcastPresence();
  }else if(msg.type === 'DUEL_INVITE' && S.user && msg.inv?.toUid === S.user.uid){
    if(!S.du && !$('#modal').innerHTML.includes('TANTANGAN DUEL MASUK')){
      showIncomingDuelModal(msg.inv);
    }
  }else if(msg.type === 'DUEL_RESP' && S.user && msg.fromUid === S.user.uid){
    if(msg.status === 'accepted' && msg.roomId && (!S.du || S.du.roomId !== msg.roomId)){
      $('#modal').innerHTML = '';
      joinLiveRoom(msg.roomId, msg.toName);
    }else if(msg.status === 'declined'){
      if($('#modal').innerHTML.includes('Menunggu')){
        $('#modal').innerHTML = `<div class='ov' onclick='cm()'><section class='pn' style='text-align:center'><div class='tag'>DITOLAK</div><p style='margin:8px 0'><b>${msg.toName}</b> sedang sibuk atau menolak tantangan.</p><button class='btn w' onclick='cm()'>Tutup</button></section></div>`;
      }
    }
  }else if(msg.type === 'ROOM_UPDATE' && S.du && S.du.roomId === msg.roomId && msg.room){
    applyRoomState(msg.room);
  }
}

if(BC) BC.onmessage = (ev) => handleRealtimeSignal(ev.data);
window.addEventListener('storage', (ev) => {
  if(ev.key === LS_PLAYERS_KEY){
    readSharedDirectory();
    if(S.user && !S.du && (S.tab==='duel' || S.tab==='profil')) render();
  }else if(ev.key === LS_SIGNAL_KEY && ev.newValue){
    try{ handleRealtimeSignal(JSON.parse(ev.newValue)); }catch(e){}
  }
});

async function initCloud(){
  if(db && auth?.currentUser) return true;
  try{
    if(typeof __firebase_config === 'undefined') return false;
    const cfg = JSON.parse(__firebase_config);
    const app = initializeApp(cfg);
    db = getFirestore(app);
    auth = getAuth(app);
    if(typeof __initial_auth_token !== 'undefined' && __initial_auth_token){
      await signInWithCustomToken(auth, __initial_auth_token);
    }else{
      await signInAnonymously(auth);
    }
    fbUid = auth.currentUser?.uid || null;
    return !!fbUid;
  }catch(e){
    return false;
  }
}

function startRealtimeListeners(){
  if(hbTimer) clearInterval(hbTimer);
  hbTimer = setInterval(()=>{
    if(S.user && S.w){
      broadcastPresence();
      syncUserCloud();
    }
  }, 5000);

  if(!db || !auth?.currentUser) return;
  if(unsubPlayers) unsubPlayers();
  unsubPlayers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'players'), (snap)=>{
    snap.forEach(d=>{
      const data = d.data();
      if(data && data.uid){
        ONLINE_USERS[data.uid] = data;
      }
    });
    if(S.user && !S.du && (S.tab==='duel' || S.tab==='profil')) render();
  }, ()=>{});

const SK=document.getElementById('sakura-bg');
const SK_PETALS=Array.from({length:26},()=>({
  x:Math.random(),y:Math.random(),
  s:5+Math.random()*6,
  vy:.0005+Math.random()*.0008,
  vx:(Math.random()-.3)*.0004,
  rot:Math.random()*6.28,
  vrot:(Math.random()-.5)*.03,
  sway:Math.random()*6.28,
  col:['#ffb7d5','#ff8fab','#ffd6e7','#ffc2d9'][Math.random()*4|0]
}));
let skLast=0;
function sakuraLoop(tm){
  const isMap = S.user && S.tab==='belajar' && !S.les;
  if(SK){
    SK.style.opacity = isMap ? '0' : '1';
    if(!isMap){
      const w=innerWidth,h=innerHeight;
      if(SK.width!==w||SK.height!==h){SK.width=w;SK.height=h}
      const g=SK.getContext('2d');
      g.clearRect(0,0,w,h);
      const dt=Math.min(40,tm-(skLast||tm));
      for(let i=0;i<SK_PETALS.length;i++){
        const p=SK_PETALS[i];
        p.y+=p.vy*dt;
        p.x+=p.vx*dt+Math.sin(tm*.0012+p.sway)*.00025*dt;
        p.rot+=p.vrot*(dt/16);
        if(p.y>1.04){p.y=-0.04;p.x=Math.random()}
        if(p.x>1.04)p.x=-0.04;
        if(p.x<-0.04)p.x=1.04;
        g.save();
        g.translate(p.x*w,p.y*h);
        g.rotate(p.rot);
        g.fillStyle=p.col;
        g.beginPath();
        g.moveTo(0,-p.s);
        g.bezierCurveTo(p.s*.9,-p.s*.6,p.s*.9,p.s*.6,0,p.s);
        g.bezierCurveTo(-p.s*.9,p.s*.6,-p.s*.9,-p.s*.6,0,-p.s);
        g.fill();
        g.restore();
      }
    }
  }
  skLast=tm;
  requestAnimationFrame(sakuraLoop);
}
requestAnimationFrame(sakuraLoop);

    g: S.user.g,
    gr: S.user.gr,

function saveSessionState(userObj){
  try{
    const val = JSON.stringify(userObj);
    if(window.sessionStorage) sessionStorage.setItem(SS_USER_KEY, val);
    document.cookie = `rascademy_session=${encodeURIComponent(val)}; path=/; max-age=2592000; SameSite=Lax`;
    window.name = 'RASCADEMY_USER:' + val;
  }catch(e){}
}

function loadSessionState(){
  try{
    if(window.sessionStorage){
      const ss = sessionStorage.getItem(SS_USER_KEY);
      if(ss) return JSON.parse(ss);
    }
    if(window.name && window.name.startsWith('RASCADEMY_USER:')){
      return JSON.parse(window.name.slice('RASCADEMY_USER:'.length));
    }
    const m = document.cookie.match(/(?:^|;\s*)rascademy_session=([^;]+)/);
    if(m) return JSON.parse(decodeURIComponent(m[1]));
  }catch(e){}
  return null;
}

function clearSessionState(){
  try{
    if(window.sessionStorage) sessionStorage.removeItem(SS_USER_KEY);
    document.cookie = 'rascademy_session=; path=/; max-age=0';
    if(window.name && window.name.startsWith('RASCADEMY_USER:')) window.name = '';
  }catch(e){}
}

function broadcastPresence(){
  if(!S.user || !S.w) return;
  const prof = buildPublicProfile();
  writeSharedPlayer(prof);
  sendCrossTabSignal({ type: 'PLAYER_SYNC', profile: prof });
}

async function syncUserCloud(){
  if(!S.user || !S.w) return;
  const publicProfile = buildPublicProfile();
  writeSharedPlayer(publicProfile);
  saveSessionState(S.user);
  sendCrossTabSignal({ type: 'PLAYER_SYNC', profile: publicProfile });
  if(!db || !auth?.currentUser) return;
  try{
    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'players', S.user.uid), publicProfile, { merge: true });
    if(fbUid){
      const privateSave = { ...S.w, exp: null };
      await setDoc(doc(db, 'artifacts', appId, 'users', fbUid, 'profile', 'state'), { activeUser: S.user, state: privateSave }, { merge: true });
    }
  }catch(e){}
}

async function refreshPlayersNow(){
  S.refreshing = true;
  render();
  readSharedDirectory();
  broadcastPresence();
  sendCrossTabSignal({ type: 'REQUEST_PRESENCE' });
  if(db && auth?.currentUser){
    try{
      const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'players'));
      snap.forEach(d=>{
        const data = d.data();
        if(data && data.uid){
          ONLINE_USERS[data.uid] = data;
          writeSharedPlayer(data);
        }
      });
    }catch(e){}
  }
  setTimeout(()=>{
    S.refreshing = false;
    if(S.user && !S.du) render();
  }, 300);
}

  }

  readSharedDirectory();

  saveSessionState(S.user);

  let loadedState = null;

        loadedState = existingSnap.data().savedState;
      }
    }catch(e){}
  }

    loadedState = ONLINE_USERS[uid].savedState;
  }

  S.w = loadedState ? { ...newWs(0), ...loadedState, exp: null } : newWs(0);

  }

  const roomData = {
    roomId,
    p1: { uid: hostUid, name: hostName, score: 0 },

    i: 0,
    ph: 'buzz',
    holder: null,
    el: null,
    ch: null,

  };
  sendCrossTabSignal({ type: 'DUEL_RESP', invId, fromUid: hostUid, toName: S.user.name, status: 'accepted', roomId });

      if(invRef) await updateDoc(invRef, { status: 'accepted', roomId });

function applyRoomState(r){
  if(!S.du || S.du.roomId !== r.roomId) return;
  const amP1 = r.p1.uid === S.user.uid;
  const meObj = amP1 ? r.p1 : r.p2;
  const opObj = amP1 ? r.p2 : r.p1;
  S.du.room = r;
  S.du.amP1 = amP1;
  S.du.on = opObj.name;
  S.du.us = meObj.score;
  S.du.os = opObj.score;
  S.du.i = r.i;
  S.du.qs = r.qs.map(x=>[x.cat, x.q, x.opts, x.ans]);
  S.du.el = r.el;
  S.du.ch = r.ch;
  S.du.msg = r.msg;
  if(r.ph === 'buzz') S.du.ph = 'buzz';
  else if(r.ph === 'ans') S.du.ph = (r.holder === S.user.uid) ? 'me' : 'opp';
  else if(r.ph === 'rb') S.du.ph = (r.holder === S.user.uid) ? 'rbme' : 'rbop';
  else if(r.ph === 'rev') S.du.ph = 'rev';
  S.du.t = Math.max(0, Math.ceil(((r.deadline || Date.now()) - Date.now()) / 1000));
  if(r.done && !S.du.done){
    S.du.done = true;
    S.du.o = S.du.us > S.du.os ? 'Menang' : S.du.us === S.du.os ? 'Seri' : 'Kalah';
    clearInterval(S.du.iv);
    S.w.duel.unshift({ o: S.du.o, on: S.du.on, us: S.du.us, os: S.du.os });
    act('Duel Live vs ' + S.du.on, S.du.o + ' (' + S.du.us + '-' + S.du.os + ')');
    ign();
    cele(S.du.o==='Menang'?'Kemenangan Live!':'Pertandingan Selesai!','Skor akhir '+S.du.us+' - '+S.du.os+' melawan '+S.du.on+'.');
  }
  if(S.tab === 'duel') render();
}

function joinLiveRoom(roomId, oppName, initialRoom=null){
  if(S.du) exitDuel();
  S.tab = 'duel';
  S.du = {
    live: true,
    roomId,
    on: oppName,
    qs: Q.slice(0,4),
    i: 0, us: 0, os: 0, t: 12,
    ph: 'buzz',
    msg: 'Menghubungkan ke panggung studio...',
    ch: null, el: null, done: false,
    room: initialRoom
  };
  S.du.iv = setInterval(()=>{
    const m = S.du;
    if(!m || m.done || !m.room) return;
    const rem = Math.max(0, Math.ceil(((m.room.deadline || Date.now()) - Date.now()) / 1000));
    m.t = rem;
    const el = document.getElementById('dtm');
    if(el) el.textContent = '⏱ 00:' + String(rem).padStart(2,'0');
    if(rem === 0 && m.amP1 && m.room.ph !== 'rev'){
      handleLiveTimeout();
    }
  }, 500);
  if(initialRoom) applyRoomState(initialRoom);
  if(db && auth?.currentUser){
    unsubRoom = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'duel_rooms', roomId), (snap)=>{
      if(!snap.exists() || !S.du) return;
      applyRoomState(snap.data());
    }, ()=>{});
  }
  render();
}

async function pushRoomUpdate(patch){
  if(!S.du || !S.du.room) return;
  const nextRoom = { ...S.du.room, ...patch };
  applyRoomState(nextRoom);
  sendCrossTabSignal({ type: 'ROOM_UPDATE', roomId: S.du.roomId, room: nextRoom });
  if(db && auth?.currentUser){
    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'duel_rooms', S.du.roomId), patch).catch(()=>{});
  }
}

async function handleLiveTimeout(){
  const m = S.du; if(!m || !m.room) return;
  const r = m.room;
  if(r.ph === 'buzz'){
    await pushRoomUpdate({ ph: 'rev', msg: 'Waktu habis! Tidak ada yang menekan bel. Kunci: ' + 'ABCD'[r.qs[r.i].ans] + '.', deadline: Date.now() + 2500 });
    setTimeout(()=>advanceLiveRound(), 2500);
  }else if(r.ph === 'ans' || r.ph === 'rb'){
    await pushRoomUpdate({ ph: 'rev', msg: 'Waktu menjawab habis! Kunci: ' + 'ABCD'[r.qs[r.i].ans] + '.', deadline: Date.now() + 2500 });
    setTimeout(()=>advanceLiveRound(), 2500);
  }
}

async function advanceLiveRound(){
  const m = S.du; if(!m || !m.room || !m.amP1) return;
  const r = m.room;

async function buzz(){
  const m=S.du;if(!m||m.ph!=='buzz')return;

    const r = m.room;

}
async function ans(i){
  const m=S.du;if(!m)return;const q=m.qs[m.i];
  if(m.live && m.room){
    const r = m.room;
    const myKey = m.amP1 ? 'p1' : 'p2';
    const oppUid = m.amP1 ? r.p2.uid : r.p1.uid;
    const oppName = m.amP1 ? r.p2.name : r.p1.name;
    const curScore = r[myKey].score;
    if(m.ph === 'me'){
      if(i === q[3]){
        const updatedP = { ...r[myKey], score: curScore + 100 };
        await pushRoomUpdate({
          [myKey]: updatedP,
          ph: 'rev',
          ch: i,
          msg: S.user.name + ' benar (+100)! Kunci: ' + 'ABCD'[q[3]] + '.',
          deadline: Date.now() + 2500
        });
        setTimeout(()=>{ if(m.amP1) advanceLiveRound(); }, 2500);
      }else{
        const updatedP = { ...r[myKey], score: curScore - 50 };
        await pushRoomUpdate({
          [myKey]: updatedP,
          ph: 'rb',
          holder: oppUid,
          el: i,
          msg: S.user.name + ' salah (−50)! Soal lemparan untuk ' + oppName + '.',
          deadline: Date.now() + 8000
        });
      }
    }else if(m.ph === 'rbme'){
      if(i === q[3]){
        const updatedP = { ...r[myKey], score: curScore + 100 };
        await pushRoomUpdate({
          [myKey]: updatedP,
          ph: 'rev',
          ch: i,
          msg: 'Lemparan ' + S.user.name + ' benar (+100)! Kunci: ' + 'ABCD'[q[3]] + '.',
          deadline: Date.now() + 2500
        });
        setTimeout(()=>{ if(m.amP1) advanceLiveRound(); }, 2500);
      }else{
        await pushRoomUpdate({
          ph: 'rev',
          ch: i,
          msg: 'Lemparan kurang tepat, skor aman. Kunci: ' + 'ABCD'[q[3]] + '.',
          deadline: Date.now() + 2500
        });
        setTimeout(()=>{ if(m.amP1) advanceLiveRound(); }, 2500);
      }
    }
    return;
  }
  clearTimeout(m.tm);if(m.ph==='me'){if(i===q[3]){m.us+=100;reveal('Tepat! +100.',q[3],i)}else{m.us-=50;m.el=i;m.ph='rbop';m.msg='Salah (−50). Lemparan ke lawan…';render();m.tm=setTimeout(()=>{if(Math.random()<.5){m.os+=100;reveal(m.on+' benar, +100.',q[3],i)}else reveal('Lawan juga salah.',q[3],i)},1600)}}else if(m.ph==='rbme'){if(i===q[3]){m.us+=100;reveal('Lemparan benar! +100.',q[3],i)}else reveal('Kurang tepat, skormu aman.',q[3],i)}
}
async function pass(){

      ph: 'rev',
      msg: S.user.name + ' melewati lemparan. Kunci: ' + 'ABCD'[m.qs[m.i][3]] + '.',
      deadline: Date.now() + 2500
    });
    setTimeout(()=>{ if(m.amP1) advanceLiveRound(); }, 2500);
    return;
  }
  clearTimeout(m.tm);reveal('Kamu melewati lemparan.',m.qs[m.i][3]);
}
function reveal(msg,ci,ch){const m=S.du;if(!m||m.done)return;clearTimeout(m.tm);m.ph='rev';m.ch=ch==null?null:ch;m.msg=msg+' Kunci: '+'ABCD'[ci]+'.';render();m.tm=setTimeout(nextD,1800)}
function nextD(){const m=S.du;if(!m)return;if(m.i+1<m.qs.length){m.i++;roundStart();render();return}
 m.o=m.us>m.os?'Menang':m.us===m.os?'Seri':'Kalah';m.done=true;clearInterval(m.iv);S.w.duel.unshift({o:m.o,on:m.on,us:m.us,os:m.os});act('Duel vs '+m.on,m.o+' ('+m.us+'-'+m.os+')');ign();render();cele(m.o==='Menang'?'Kemenangan Duel!':'Duel Selesai!','Skor akhir '+m.us+' - '+m.os+' melawan '+m.on+'.')}
